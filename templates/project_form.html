{% extends 'base.html' %}

{% block meta %}
    <title> {{ page_title }} - {{ name }}</title>
{% endblock meta %}

{% block content %}
    <main>
        <section id="form">
            <div class="container">
                <form method="post"
                      action=""
                      class="form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div class="form-button-group">
                        <button type="submit" class="button button-main">{{ page_title }}</button>
                        <a href="{% url 'main:show_project' %}" class="button button-secondary button-color1">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
