{% extends 'base.html' %}
{% block meta %}
    <title>Add Experience - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section id="form">
            <div class="container">
                <h1>Add New Experience</h1>
                <form method="post"
                      action="{% url 'main:create_experience' %}"
                      class="experience-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div class="form-button-group">
                        <button type="submit" class="button button-main">Add Experience</button>
                        <a href="{% url 'main:show_experience' %}" class="button button-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
{% endblock content %}
