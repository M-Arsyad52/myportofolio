<form method="post" action="{% url 'main:toggle_star_project' project.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-color1 button-star1{% if user in project.starred_by.all %} is-starred{% endif %}"
            title="{% if project.starred_by.all %}Starred by {{ project.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in project.starred_by.all %}
            Unstar
        {% else %}
            Star
        {% endif %}
        <span class="star-count1">{{ project.starred_by.count }}</span>
    </button>
</form>
