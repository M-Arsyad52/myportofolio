<div id="edit-project-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-project-modal-title">
     
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-project-modal"
            popovertargetaction="hide"
            aria-label="Close edit project form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-project-modal"
                popovertargetaction="hide"
                aria-label="Close edit project form">×</button>

        <h2 id="edit-project-modal-title">Edit Project</h2>
        
        <form id="edit-project-form" class="project-form">
    
            <input type="hidden" id="edit-id" name="id">

            <div class="form-group">
                <label for="edit-title">Title</label>
                <input type="text" name="title" id="edit-title" required>
            </div>

            <div class="form-group">
                <label for="edit-type">Type</label>
                <input type="text" name="type" id="edit-type" required>
            </div>

            <div class="form-group">
                <label for="edit-tech-stack">Tech Stack</label>
                <input type="text" name="tech_stack" id="edit-tech-stack" required>
            </div>

            <div class="form-group">
                <label for="edit-description">Description</label>
                <textarea name="description" id="edit-description" required></textarea>
            </div>

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-project-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-color1">Save Changes</button>
            </div>
        </form>
    </div>
</div>
