<div id="edit-experience-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
     
    <button type="button"
            class="experience-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Close edit experience form"></button>

    <div class="experience-form-modal__content">
        <button type="button"
                class="experience-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Close edit experience form">×</button>

        <h2 id="edit-experience-modal-title">Edit Experience</h2>
        
        <form id="edit-experience-form" class="experience-form">
            
            <input type="hidden" id="edit-id" name="id">

            <div class="form-group">
                <label for="edit-title">Title</label>
                <input type="text" name="title" id="edit-title" required>
            </div>

            <div class="form-group">
                <label for="edit-category">Category</label>
                <input type="text" name="category" id="edit-category" required>
            </div>

            <div class="form-group">
                <label for="edit-description">Description</label>
                <textarea name="description" id="edit-description" required></textarea>
            </div>

            <div class="experience-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
